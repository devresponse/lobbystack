name: Billing scenarios

# The Stripe plan's sandbox scenarios (scripts/billing-scenarios.ts) against a
# Stripe sandbox of their own, started by hand. The sandbox's test key is the
# repository secret STRIPE_SCENARIOS_KEY, which pull requests can't read. GitHub
# lists a manual workflow only once its file is on the default branch; until
# then, run pnpm billing:scenarios from a computer (docs/providers/stripe.md).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Scenarios to run, comma-separated; empty runs every one"
        required: false
        default: ""
      brand:
        description: "The brand whose billing.json sets the sandbox up, one that sells Starter and Pro"
        required: false
        default: "alloplace"

permissions:
  contents: read

# Two runs in one sandbox would share its test clocks' limits and its catalog.
concurrency:
  group: billing-scenarios
  cancel-in-progress: false

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - name: Run the scenarios
        env:
          STRIPE_SCENARIOS_KEY: ${{ secrets.STRIPE_SCENARIOS_KEY }}
          ONLY: ${{ inputs.only }}
          BRAND: ${{ inputs.brand }}
        run: pnpm billing:scenarios --brand "$BRAND" ${ONLY:+--only "$ONLY"}
