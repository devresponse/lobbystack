  # Every chat and call keeps the 8 FAQs with the highest priority ready, with
  # no search. These carry 93 to 100, above the 0 an entry gets by default.
  faqs:
    - question: How much does RealInfoBot cost?
      priority: 100
      answer: >-
        RealInfoBot is paid once per listing, in Canadian dollars plus tax,
        with no subscription. Try it, 1 listing for 180 days: CA$99, with 250
        voice minutes, 300 website chats and a phone number. 3 listings at once
        for 365 days: CA$249, or CA$83 a listing. Pro, 6 listings at once for
        365 days: CA$449, or CA$75 a listing. The free plan, CA$0, is for
        setting up and testing one listing, with no phone number and 5 website
        chats a month. Extra minutes cost CA$39 for 100. Every pack has a full
        refund if asked within 30 days.
    - question: What is RealInfoBot?
      priority: 99
      answer: >-
        RealInfoBot turns a real estate listing's sign into an assistant that
        answers buyers' questions about the home, day or night, in the buyer's
        language. Buyers scan the QR code on the sign to chat, or call the
        listing's RealInfoBot number with a pack. The assistant answers only
        from the agent's facts, says it's an AI, takes a message when it
        doesn't know, and sends the agent every inquiry with a summary and the
        transcript. It's made by Real Info Box Inc. of Calgary, Alberta.
    - question: How do I get started with RealInfoBot?
      priority: 98
      answer: >-
        Sign up free at https://ca.realinfobot.com/en/signup. Setup takes about
        ten minutes: name the business, choose a plan (the free plan needs no
        payment), add the listing's facts by uploading the feature sheet or
        pasting text, set the greeting and, with a pack, pick a phone number.
        To hear it first, try the sample listing on https://realinfobot.com/ca.
        RealInfoBot's team can also set it up with you: email
        support@realinfobot.com with the listing link.
    - question: Which RealInfoBot plan should I choose?
      priority: 97
      answer: >-
        One listing: the 1-listing pack, CA$99 for 180 days. Two or three
        listings at once, or a few a year: the 3-listing pack, CA$249 for 365
        days. Four or more at once, or always a sign up: the 6-listing pack,
        CA$449 for 365 days. Just exploring: the free plan. When a home sells,
        the next listing takes its place for as long as the pack lasts. For a
        brokerage or more than 6 listings at once, email
        support@realinfobot.com.
    - question: Is RealInfoBot a subscription, and can I get a refund?
      priority: 96
      answer: >-
        There's no subscription. Each listing pack is paid once and ends on its
        date: nothing renews, there's no monthly bill and nothing to cancel.
        RealInfoBot's terms give a full refund on a pack if asked within 30
        days of purchase, no questions asked, whatever was used. After 30 days
        there's no refund. Ask at support@realinfobot.com with the account
        email and order number.
    - question: Can buyers call or text my listing?
      priority: 95
      answer: >-
        Buyers scan the listing's QR code to chat with the assistant, on any
        plan. With a listing pack, the account gets one RealInfoBot phone
        number, and the assistant answers calls to it out loud, any hour;
        buyers can also call from the listing's page in their browser. Buyers
        can text the number too, but the AI doesn't answer texts: they land in
        the agent's Messages inbox, and the agent replies from the app. With
        several listings, callers say which home they mean.
    - question: What will the assistant say to buyers, and what won't it?
      priority: 94
      answer: >-
        It says it's an AI, and every call says it's recorded and transcribed.
        It answers only from the agent's facts, never from general knowledge.
        When it doesn't know, it says so, takes a message and adds the question
        to the agent's Questions list. It gives no opinions on price, offers,
        the neighbourhood or the market, and no legal, financial or mortgage
        advice. Anyone who wants a person leaves their name and number, or on a
        call is put through to the agent's phone when the agent allows it.
    - question: How do I talk to a person at RealInfoBot?
      priority: 93
      answer: >-
        Email support@realinfobot.com. A person answers Monday to Friday, 9
        a.m. to 5 p.m. Mountain time. RealInfoBot's assistant can also take a
        message with your name, phone number and what you'd like to talk about,
        so RealInfoBot's team calls you back. Teams and brokerages can ask
        there about what they need.

# Leave the business's setup steps as they are.
onboarding:
  complete: false
