  # Every chat and call keeps the 8 FAQs with the highest priority ready, with
  # no search. These carry 93 to 100, above the 0 an entry gets by default.
  faqs:
    - question: How much does RealInfoBot cost?
      priority: 100
      answer: >-
        RealInfoBot has a free plan and three listing packs, paid once in
        Canadian dollars plus tax, with no subscription. Free, CA$0: 1 listing,
        30 voice minutes and 5 website chats a month, and no phone number.
        1 listing for 180 days, CA$99: 250 voice minutes and 300 website chats.
        3 listings for 365 days, CA$249: 750 minutes and 1,800 chats. 6 listings
        for 365 days, CA$449: 1,500 minutes and 3,600 chats. Every pack includes
        1 phone number for the account. Extra minutes cost CA$39 for 100,
        lasting 180 days. Owners and admins buy on the Plan tab in Settings,
        https://ca.realinfobot.com/settings/plan.
    - question: What is RealInfoBot?
      priority: 99
      answer: >-
        RealInfoBot gives each of a real estate agent's listings an AI assistant
        that answers buyers' questions about the home at any hour, in the
        buyer's language, only from the facts the agent adds. Buyers scan the
        QR code on the sign to chat on the listing's page, and with a listing
        pack they can call its RealInfoBot number. Every inquiry reaches the
        agent with a summary and the transcript, and buyers who leave their
        details become contacts. The app is at https://ca.realinfobot.com.
    - question: How do I contact RealInfoBot support?
      priority: 98
      answer: >-
        Email support@realinfobot.com, from your account's email address if you
        have an account. People answer Monday to Friday, 9 a.m. to 5 p.m.
        Mountain time, and aim to reply within 2 business days. Say what you
        expected and when it happened, and give your order number for a payment
        question. Support can also set up a listing with you.
    - question: How do I get started with RealInfoBot?
      priority: 97
      answer: >-
        Sign up at https://ca.realinfobot.com/en/signup with your email and a
        password, and enter the code emailed to you. Setup takes about ten
        minutes: your business's name, a plan (the free plan needs no payment),
        your website's address, your listing's facts or documents, the greeting
        and, with a pack, a phone number. Then create a chat widget on the
        Website widget screen, choose it on Settings > Public profile, publish
        your page there, and print your QR code from Settings > QR code.
    - question: Is RealInfoBot a subscription, and how do I cancel?
      priority: 96
      answer: >-
        No. Listing packs are paid once and end on their date, so nothing renews
        and there's nothing to cancel, and the free plan costs nothing. To close
        the account, an owner uses Cancel account on Settings > Team, which
        closes the business without deleting anything, or Delete business, which
        erases it for good.
    - question: Can I get a refund?
      priority: 95
      answer: >-
        Yes, in full, if you ask within 30 days of buying a listing pack,
        whatever was used. After 30 days there's no refund, including for unused
        minutes and listings that sell early. Email support@realinfobot.com with
        your account email and order number. Polar, RealInfoBot's merchant of
        record, returns the money to your payment method.
    - question: Does each listing get its own phone number?
      priority: 94
      answer: >-
        No. Every listing pack includes one RealInfoBot phone number for the
        account, and the free plan has none. Each listing has its own AI agent,
        web page and QR codes. With several listings, set the number to your
        main AI agent on Settings > Phone Number: it answers from every
        listing's facts, and callers say which home they mean.
    - question: Does the RealInfoBot assistant answer text messages?
      priority: 93
      answer: >-
        No. The AI answers phone calls and chats only. Texts to your RealInfoBot
        number wait on the Messages screen, where you or your team reply by
        hand. RealInfoBot texts only alerts to your team, verification codes,
        and showing confirmations and reminders that buyers agreed to.

